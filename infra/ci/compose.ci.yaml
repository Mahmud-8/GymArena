# Local SonarQube and Jenkins for the PM2 DevOps review.
# Start: docker compose -f infra/ci/compose.ci.yaml up -d
# SonarQube: http://localhost:9000   Jenkins: http://localhost:8080
name: gymarena-ci

services:
  sonarqube:
    image: sonarqube:10.7-community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    depends_on:
      - sonarqube

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home:
