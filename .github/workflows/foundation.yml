name: GymArena Foundation CI and GHCR

on:
  push:
    branches: [main, develop, feature/docker-foundation]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and smoke test eight services
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: gymarena-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GYMARENA_REVISION: ${{ github.sha }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build all services and wait for readiness
        run: docker compose --progress plain up -d --build --wait --wait-timeout 180
      - name: Verify HTTP contracts ownership and database recovery
        run: python tests/smoke_foundation.py --exercise-recovery --report ci-evidence/smoke.json
      - name: Export the exact tested images
        if: github.event_name != 'pull_request'
        run: python scripts/ci_images.py export --directory ci-images
      - name: Transfer tested images to the publication job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images-${{ github.sha }}
          path: ci-images/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Collect diagnostic evidence
        if: always()
        run: |
          mkdir -p ci-evidence
          docker compose ps -a --format json > ci-evidence/containers.json
          docker compose logs --no-color > ci-evidence/compose.log 2>&1
          docker version > ci-evidence/docker-version.txt
          docker compose version > ci-evidence/compose-version.txt
      - name: Retain smoke results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-evidence-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Remove this isolated runner project
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish tested images to GHCR
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'Mahmud-8/GymArena' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/feature/docker-foundation')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the same revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download the successful job images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images-${{ github.sha }}
          path: ci-images/
      - name: Authenticate with the repository workflow token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify all eight registry digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_images.py publish --directory ci-images --report ci-publication/published-images.json
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-publication-${{ github.sha }}
          path: ci-publication/
          if-no-files-found: warn
          retention-days: 90
