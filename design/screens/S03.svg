<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Confirm your weight</title><rect width="1440" height="980" fill="#F5F6F2"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#FFFFFF"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18211D"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="980" dy="0">MEMBER KIOSK</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="40" dy="0">KIOSK</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="40" dy="0">Confirm your weight</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="40" dy="0">Step 2 of 4 · Omar Hassan · Member code GA-0107</tspan></text><rect x="40.0" y="263" width="670.0" height="158" rx="14" fill="#FFFFFF"/><text x="62.0" y="295" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="62.0" dy="0">Connected scale</tspan></text><text x="62.0" y="346" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="62.0" dy="0">75.2 kg</tspan></text><text x="62.0" y="386" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="62.0" dy="0">Stable reading</tspan></text><rect x="730.0" y="263" width="670.0" height="158" rx="14" fill="#FFFFFF"/><text x="752.0" y="295" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="752.0" dy="0">Last saved weight</tspan></text><text x="752.0" y="346" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="752.0" dy="0">76.0 kg</tspan></text><text x="752.0" y="386" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="752.0" dy="0">Previous visit</tspan></text><rect x="40" y="445" width="1360" height="90" rx="12" fill="#E7F0E9"/><text x="64" y="479" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#235C43"><tspan x="64" dy="0">Ready to save</tspan></text><text x="64" y="508" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="64" dy="0">Check the displayed value. The reading is saved to your profile only after you confirm it.</tspan></text><rect x="40.0" y="559" width="669.0" height="195" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="64.0" y="604" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="64.0" dy="0">How to measure</tspan></text><text x="64.0" y="645" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="64.0" dy="0">Step onto the connected scale and stand still until the reading is stable.</tspan></text><rect x="731.0" y="559" width="669.0" height="195" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="755.0" y="604" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="755.0" dy="0">Reading unavailable?</tspan></text><text x="755.0" y="645" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="755.0" dy="0">Your last accepted measurement stays unchanged.</tspan></text><a href="S25.svg"><rect x="755.0" y="667" width="215.21875" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="775.0" y="694" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="775.0" dy="0">View connection issue</tspan></text></a><a href="S04.svg"><rect x="40" y="778" width="165.34375" height="48" rx="9" fill="#CCE879"/><text x="60" y="805" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Confirm 75.2 kg</tspan></text></a><a href="S03.svg"><rect x="217.34375" y="778" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="237.34375" y="805" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="237.34375" dy="0">Read again</tspan></text></a><text x="40" y="864" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>