<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Paused for both participants</title><rect width="1440" height="980" fill="#14241D"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#14241D"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#CCE879"><tspan x="980" dy="0">FITNESS ARENA</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#CCE879"><tspan x="40" dy="0">LIVE</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF"><tspan x="40" dy="0">Paused for both participants</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF"><tspan x="40" dy="0">Position B is no longer tracked reliably. Counters and the common active timer are frozen.</tspan></text><rect x="40" y="263" width="1010" height="420" rx="15" fill="#20372C"/><text x="64" y="295" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="64" dy="0">CAMERA 01 / PREVIEW</tspan></text><rect x="866" y="281" width="129.265625" height="28" rx="6" fill="#FFF2D9"/><text x="878" y="296" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#8D5D0D"><tspan x="878" dy="0">Tracking paused</tspan></text><svg x="64" y="328" width="962" height="290" viewBox="0 0 800 310"><path d="M20 290H780M70 275H730" stroke="#456452" fill="none"/><g stroke="#CCE879" stroke-width="7" stroke-linecap="round" fill="none"><circle cx="230" cy="55" r="23"/><path d="M230 83V178M165 128L230 102L295 128M230 178L184 261M230 178L276 261"/><rect x="137" y="15" width="186" height="265" rx="16" stroke-width="1" stroke-dasharray="8 8"/></g><g stroke="#D4AA54" stroke-width="7" stroke-linecap="round" fill="none"><circle cx="570" cy="55" r="23"/><path d="M570 83V178M505 128L570 102L635 128M570 178L524 261M570 178L616 261"/><rect x="477" y="15" width="186" height="265" rx="16" stroke-width="1" stroke-dasharray="8 8"/></g></svg><text x="64" y="647" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF"><tspan x="64" dy="0">POSITION A / OMAR HASSAN</tspan></text><text x="565.0" y="647" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF"><tspan x="565.0" dy="0">POSITION B / TRACKING LOST</tspan></text><rect x="1074" y="263" width="326" height="420" rx="12" fill="#FFFFFF"/><text x="1098" y="307" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">Restore the session</tspan></text><text x="1098" y="347" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Move back into view, then confirm both</tspan><tspan x="1098" dy="21">identities and positions.</tspan></text><text x="1098" y="400" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Retained accepted reps</tspan></text><text x="1098" y="426" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">Omar 12 · Salma 10</tspan></text><text x="1098" y="459" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Frozen active timer</tspan></text><text x="1098" y="485" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">00:34 remaining</tspan></text><text x="1098" y="518" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Partial movements</tspan></text><text x="1098" y="544" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">Discarded on pause</tspan></text><text x="40" y="721" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF"><tspan x="40" dy="0">No points are deducted for camera faults or a discomfort stop. If tracking or identity cannot be restored, close this attempt as incomplete.</tspan></text><a href="S12.svg"><rect x="40" y="752" width="259.546875" height="48" rx="9" fill="#CCE879"/><text x="60" y="779" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Confirm positions &amp; resume</tspan></text></a><a href="S17.svg"><rect x="311.546875" y="752" width="222.609375" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="331.546875" y="779" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="331.546875" dy="0">Cannot restore — close</tspan></text></a><a href="S17.svg"><rect x="546.15625" y="752" width="185.125" height="48" rx="9" fill="#FBE8E4"/><text x="566.15625" y="779" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#A03D32"><tspan x="566.15625" dy="0">Stop — discomfort</tspan></text></a><text x="40" y="838" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#FFFFFF"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>