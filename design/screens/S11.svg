<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Keep your rhythm, Omar</title><rect width="1440" height="980" fill="#14241D"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#14241D"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#CCE879"><tspan x="980" dy="0">FITNESS ARENA</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#CCE879"><tspan x="40" dy="0">LIVE</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF"><tspan x="40" dy="0">Keep your rhythm, Omar</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF"><tspan x="40" dy="0">Solo · Squats · Level 2 · Ranked attempt</tspan></text><rect x="40" y="263" width="1010" height="420" rx="15" fill="#20372C"/><text x="64" y="295" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="64" dy="0">CAMERA 01 / PREVIEW</tspan></text><rect x="866" y="281" width="114.4375" height="28" rx="6" fill="#E7F0E9"/><text x="878" y="296" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="878" dy="0">Camera ready</tspan></text><svg x="64" y="328" width="962" height="290" viewBox="0 0 800 310"><path d="M20 290H780M70 275H730" stroke="#456452" fill="none"/><g stroke="#CCE879" stroke-width="7" stroke-linecap="round" fill="none"><circle cx="400" cy="55" r="23"/><path d="M400 83V178M335 128L400 102L465 128M400 178L354 261M400 178L446 261"/><rect x="307" y="15" width="186" height="265" rx="16" stroke-width="1" stroke-dasharray="8 8"/></g></svg><text x="64" y="647" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF"><tspan x="64" dy="0">POSITION A / OMAR HASSAN</tspan></text><rect x="1074" y="263" width="326" height="420" rx="12" fill="#FFFFFF"/><text x="1098" y="307" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">Your challenge</tspan></text><text x="1098" y="347" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Keep your full body inside the marked</tspan><tspan x="1098" dy="21">area.</tspan></text><text x="1098" y="432" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">12 / 20</tspan></text><text x="1098" y="476" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Active time remaining</tspan></text><text x="1098" y="502" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">00:34</tspan></text><text x="1098" y="535" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Movement cue</tspan></text><text x="1098" y="561" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">Complete the full cycle</tspan></text><text x="40" y="721" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF"><tspan x="40" dy="0">Only accepted repetitions count. If tracking becomes unreliable, counting and active time pause together.</tspan></text><a href="S13.svg"><rect x="40" y="752" width="231.515625" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="60" y="779" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Pause &amp; check positions</tspan></text></a><a href="S17.svg"><rect x="283.515625" y="752" width="185.125" height="48" rx="9" fill="#FBE8E4"/><text x="303.515625" y="779" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#A03D32"><tspan x="303.515625" dy="0">Stop — discomfort</tspan></text></a><text x="40" y="838" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#FFFFFF"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>