<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Let’s set up your profile</title><rect width="1440" height="980" fill="#F5F6F2"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#FFFFFF"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18211D"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="980" dy="0">MEMBER KIOSK</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="40" dy="0">KIOSK</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="40" dy="0">Let’s set up your profile</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="40" dy="0">Step 1 of 4 · Profile → Weight → Face choice → Trainer assessment</tspan></text><rect x="40" y="263" width="1360" height="138" rx="12" fill="#FFFFFF"/><text x="64.0" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="64.0" dy="0">Full name</tspan></text><rect x="64.0" y="314" width="644.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="78.0" y="340" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="78.0" dy="0">Omar Hassan</tspan></text><text x="732.0" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="732.0" dy="0">Age</tspan></text><rect x="732.0" y="314" width="644.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="746.0" y="340" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="746.0" dy="0">22</tspan></text><rect x="40" y="425" width="1360" height="90" rx="12" fill="#E7F0E9"/><text x="64" y="459" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#235C43"><tspan x="64" dy="0">One profile for every visit</tspan></text><text x="64" y="488" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="64" dy="0">We will create a unique member code after you save. Use it whenever you prefer not to use face recognition.</tspan></text><text x="40" y="553" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#66736B"><tspan x="40" dy="0">Your starting exercise level will be set by a trainer after an assessment. Age and weight do not measure muscular strength.</tspan></text><a href="S03.svg"><rect x="40" y="584" width="186.15625" height="48" rx="9" fill="#CCE879"/><text x="60" y="611" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Save and continue</tspan></text></a><a href="S01.svg"><rect x="238.15625" y="584" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="258.15625" y="611" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="258.15625" dy="0">Back</tspan></text></a><text x="40" y="670" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>