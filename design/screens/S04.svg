<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Choose how you return</title><rect width="1440" height="980" fill="#F5F6F2"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#FFFFFF"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18211D"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="980" dy="0">MEMBER KIOSK</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="40" dy="0">KIOSK</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="40" dy="0">Choose how you return</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="40" dy="0">Step 3 of 4 · Face enrollment is optional. Your member code always works.</tspan></text><rect x="40" y="263" width="1010" height="420" rx="15" fill="#20372C"/><text x="64" y="295" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF"><tspan x="64" dy="0">CAMERA 01 / PREVIEW</tspan></text><rect x="866" y="281" width="114.4375" height="28" rx="6" fill="#E7F0E9"/><text x="878" y="296" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="878" dy="0">Camera ready</tspan></text><svg x="64" y="328" width="962" height="290" viewBox="0 0 800 310"><path d="M20 290H780M70 275H730" stroke="#456452" fill="none"/><g stroke="#CCE879" stroke-width="7" stroke-linecap="round" fill="none"><circle cx="400" cy="55" r="23"/><path d="M400 83V178M335 128L400 102L465 128M400 178L354 261M400 178L446 261"/><rect x="307" y="15" width="186" height="265" rx="16" stroke-width="1" stroke-dasharray="8 8"/></g></svg><text x="64" y="647" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF"><tspan x="64" dy="0">POSITION A / OMAR HASSAN</tspan></text><rect x="1074" y="263" width="326" height="420" rx="12" fill="#FFFFFF"/><text x="1098" y="307" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">Face enrollment</tspan></text><text x="1098" y="347" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Save a face reference to suggest your</tspan><tspan x="1098" dy="21">profile on a later visit. Every match</tspan><tspan x="1098" dy="21">needs your confirmation.</tspan></text><text x="1098" y="421" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Your choice</tspan></text><text x="1098" y="447" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">I agree to face enrollment</tspan></text><text x="1098" y="480" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#66736B"><tspan x="1098" dy="0">Alternative</tspan></text><text x="1098" y="506" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#18211D"><tspan x="1098" dy="0">Use GA-0107 instead</tspan></text><text x="40" y="721" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#66736B"><tspan x="40" dy="0">You can remove your face reference later in Profile &amp; privacy. The camera is used for identity here, not strength measurement.</tspan></text><a href="S07.svg"><rect x="40" y="752" width="171.53125" height="48" rx="9" fill="#CCE879"/><text x="60" y="779" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Agree and enroll</tspan></text></a><a href="S07.svg"><rect x="223.53125" y="752" width="262.359375" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="243.53125" y="779" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="243.53125" dy="0">Continue with member code</tspan></text></a><text x="40" y="838" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>