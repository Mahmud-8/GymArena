<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>A challenge picked for you</title><rect width="1440" height="980" fill="#F5F6F2"/><text x="264" y="47" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena / A challenge picked for you</tspan></text><rect x="1240" y="32" width="121.453125" height="28" rx="6" fill="#F5F6F2"/><text x="1252" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="1252" dy="0">Prototype data</tspan></text><text x="264" y="103" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="264" dy="0">MEMBER</tspan></text><text x="264" y="150" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="264" dy="0">A challenge picked for you</tspan></text><text x="264" y="194" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="264" dy="0">Your next target uses your trainer-approved exercise level and approved result history.</tspan></text><rect x="264.0" y="230" width="368.0" height="158" rx="14" fill="#FFFFFF"/><text x="286.0" y="262" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="286.0" dy="0">Your points</tspan></text><text x="286.0" y="313" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="286.0" dy="0">190</tspan></text><text x="286.0" y="353" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="286.0" dy="0">Approved results only</tspan></text><rect x="652.0" y="230" width="368.0" height="158" rx="14" fill="#FFFFFF"/><text x="674.0" y="262" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="674.0" dy="0">Exercise level</tspan></text><text x="674.0" y="313" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="674.0" dy="0">Level 2</tspan></text><text x="674.0" y="353" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="674.0" dy="0">Trainer approved</tspan></text><rect x="1040.0" y="230" width="368.0" height="158" rx="14" fill="#FFFFFF"/><text x="1062.0" y="262" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="1062.0" dy="0">Latest weight</tspan></text><text x="1062.0" y="313" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="1062.0" dy="0">75.2 kg</tspan></text><text x="1062.0" y="353" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="1062.0" dy="0">Confirmed measurement</tspan></text><rect x="264.0" y="412" width="561.0" height="244" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="288.0" y="457" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="288.0" dy="0">Squat challenge</tspan></text><text x="288.0" y="498" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="288.0" dy="0">20 accepted repetitions · 60 seconds of active time. Sample</tspan><tspan x="288.0" dy="24">rule version SQ-L2-v1.</tspan></text><rect x="288.0" y="544" width="116.796875" height="28" rx="6" fill="#E7F0E9"/><text x="300.0" y="559" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="300.0" dy="0">Ready to start</tspan></text><a href="S09.svg"><rect x="288.0" y="586" width="183.46875" height="48" rx="9" fill="#CCE879"/><text x="308.0" y="613" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="308.0" dy="0">Set up my session</tspan></text></a><rect x="847.0" y="412" width="561.0" height="244" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="871.0" y="457" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="871.0" dy="0">Keep track of your progress</tspan></text><text x="871.0" y="498" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="871.0" dy="0">Review approved attempts, weight history and points.</tspan><tspan x="871.0" dy="24">Incomplete attempts never reduce your score.</tspan></text><a href="S15.svg"><rect x="871.0" y="544" width="180.90625" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="891.0" y="571" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="891.0" dy="0">View my progress</tspan></text></a><rect x="264" y="680" width="1144" height="90" rx="12" fill="#E7F0E9"/><text x="288" y="714" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#235C43"><tspan x="288" dy="0">Before you begin</tspan></text><text x="288" y="743" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="288" dy="0">Completion reward +10 points · Valid timeout below target −5 points. Interrupted and discomfort-stopped sessions change no points.</tspan></text><a href="S26.svg"><rect x="264" y="794" width="206.828125" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="284" y="821" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="284" dy="0">Edit profile &amp; privacy</tspan></text></a><text x="264" y="880" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text><rect x="0" y="0" width="232" height="980" rx="0" fill="#14241D"/><text x="24" y="56" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF"><tspan x="24" dy="0">gymarena</tspan></text><text x="24" y="104" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#CCE879"><tspan x="24" dy="0">MEMBER SPACE</tspan></text><a href="S06.svg"><rect x="16" y="137" width="200" height="46" rx="8" fill="#235C43"/><text x="32" y="162" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">My home</tspan></text></a><a href="S15.svg"><text x="32" y="219" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">My progress</tspan></text></a><a href="S16.svg"><text x="32" y="276" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Leaderboard</tspan></text></a><a href="S26.svg"><text x="32" y="333" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Profile &amp; privacy</tspan></text></a><text x="30" y="868" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF"><tspan x="30" dy="0">Omar Hassan</tspan></text><text x="30" y="894" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#B5C8BB"><tspan x="30" dy="0">GA-0107</tspan></text><text x="30" y="938" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"><tspan x="30" dy="0">Open member kiosk</tspan></text></svg>