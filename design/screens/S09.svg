ext x="288.0" y="368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="288.0" dy="0">Position A</tspan></text><rect x="288.0" y="383" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="302.0" y="409" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="302.0" dy="0">Omar Hassan · Level 2</tspan></text><text x="848.0" y="368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="848.0" dy="0">Position B</tspan></text><rect x="848.0" y="383" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="862.0" y="409" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="862.0" dy="0">Salma Ali · Level 2</tspan></text><rect x="264.0" y="494" width="368.0" height="158" rx="14" fill="#FFFFFF"/><text x="286.0" y="526" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="286.0" dy="0">Assigned targets</tspan></text><text x="286.0" y="577" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="286.0" dy="0">20 / 20</tspan></text><text x="286.0" y="617" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="286.0" dy="0">Squats · SQ-L2-v1</tspan></text><rect x="652.0" y="494" width="368.0" height="158" rx="14" fill="#FFFFFF"/><text x="674.0" y="526" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="674.0" dy="0">Shared active timer</tspan></text><text x="674.0" y="577" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="674.0" dy="0">60 sec</tspan></text><text x="674.0" y="617" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="674.0" dy="0">Paused time excluded</tspan></text><rect x="1040.0" y="494" width="368.0