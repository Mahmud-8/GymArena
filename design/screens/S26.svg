<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Profile &amp; privacy</title><rect width="1440" height="980" fill="#F5F6F2"/><text x="264" y="47" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena / Profile &amp; privacy</tspan></text><rect x="1240" y="32" width="121.453125" height="28" rx="6" fill="#F5F6F2"/><text x="1252" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="1252" dy="0">Prototype data</tspan></text><text x="264" y="103" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="264" dy="0">MEMBER</tspan></text><text x="264" y="150" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="264" dy="0">Profile &amp; privacy</tspan></text><text x="264" y="194" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="264" dy="0">Correct your details and choose whether to keep face recognition enabled.</tspan></text><rect x="264" y="230" width="1144" height="240" rx="12" fill="#FFFFFF"/><text x="288.0" y="266" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="288.0" dy="0">Full name</tspan></text><rect x="288.0" y="281" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="302.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="302.0" dy="0">Omar Hassan</tspan></text><text x="848.0" y="266" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="848.0" dy="0">Age</tspan></text><rect x="848.0" y="281" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="862.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="862.0" dy="0">22</tspan></text><text x="288.0" y="368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="288.0" dy="0">Member code</tspan></text><rect x="288.0" y="383" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="302.0" y="409" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="302.0" dy="0">GA-0107 · Read only</tspan></text><text x="848.0" y="368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="848.0" dy="0">Face reference</tspan></text><rect x="848.0" y="383" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="862.0" y="409" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="862.0" dy="0">Enrolled with agreement</tspan></text><rect x="264" y="494" width="1144" height="90" rx="12" fill="#E7F0E9"/><text x="288" y="528" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#235C43"><tspan x="288" dy="0">Your member code stays available</tspan></text><text x="288" y="557" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="288" dy="0">Removing your face reference withdraws your face-recognition agreement and deletes the enrolled reference. You can continue with your member code.</tspan></text><rect x="264.0" y="608" width="561.0" height="202" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="288.0" y="653" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="288.0" dy="0">Profile details</tspan></text><text x="288.0" y="694" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="288.0" dy="0">Keep your name and age accurate. Subscription changes are</tspan><tspan x="288.0" dy="24">handled by authorized staff.</tspan></text><a href="S06.svg"><rect x="288.0" y="740" width="192.703125" height="48" rx="9" fill="#CCE879"/><text x="308.0" y="767" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="308.0" dy="0">Save profile details</tspan></text></a><rect x="847.0" y="608" width="561.0" height="202" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="871.0" y="653" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="871.0" dy="0">Face recognition</tspan></text><text x="871.0" y="694" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="871.0" dy="0">Optional access method. Confirmation is required on every</tspan><tspan x="871.0" dy="24">returning match.</tspan></text><a href="S05.svg"><rect x="871.0" y="740" width="222.390625" height="48" rx="9" fill="#FBE8E4"/><text x="891.0" y="767" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#A03D32"><tspan x="891.0" dy="0">Remove face reference</tspan></text></a><a href="S06.svg"><rect x="264" y="834" width="192.15625" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="284" y="861" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="284" dy="0">Return to my home</tspan></text></a><text x="264" y="920" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text><rect x="0" y="0" width="232" height="980" rx="0" fill="#14241D"/><text x="24" y="56" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF"><tspan x="24" dy="0">gymarena</tspan></text><text x="24" y="104" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#CCE879"><tspan x="24" dy="0">MEMBER SPACE</tspan></text><a href="S06.svg"><text x="32" y="162" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">My home</tspan></text></a><a href="S15.svg"><text x="32" y="219" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">My progress</tspan></text></a><a href="S16.svg"><text x="32" y="276" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Leaderboard</tspan></text></a><a href="S26.svg"><rect x="16" y="308" width="200" height="46" rx="8" fill="#235C43"/><text x="32" y="333" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Profile &amp; privacy</tspan></text></a><text x="30" y="868" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF"><tspan x="30" dy="0">Omar Hassan</tspan></text><text x="30" y="894" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#B5C8BB"><tspan x="30" dy="0">GA-0107</tspan></text><text x="30" y="938" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"><tspan x="30" dy="0">Open member kiosk</tspan></text></svg>