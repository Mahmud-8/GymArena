<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Staff sign in</title><rect width="1440" height="980" fill="#F5F6F2"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#FFFFFF"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18211D"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="980" dy="0">MEMBER KIOSK</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="40" dy="0">KIOSK</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="40" dy="0">Staff sign in</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="40" dy="0">Access is limited to authorized reception staff, trainers and managers.</tspan></text><rect x="40" y="263" width="1360" height="138" rx="12" fill="#FFFFFF"/><text x="64.0" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="64.0" dy="0">Account</tspan></text><rect x="64.0" y="314" width="644.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="78.0" y="340" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="78.0" dy="0">Authorized staff account</tspan></text><text x="732.0" y="299" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="732.0" dy="0">Password</tspan></text><rect x="732.0" y="314" width="644.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="746.0" y="340" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="746.0" dy="0">••••••••••••</tspan></text><rect x="40" y="425" width="1360" height="90" rx="12" fill="#FFFFFF"/><text x="64" y="459" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#235C43"><tspan x="64" dy="0">Access follows your role</tspan></text><text x="64" y="488" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="64" dy="0">Membership changes, reminder rules, trainer approvals, weight history and face references require the appropriate permissions.</tspan></text><a href="S18.svg"><rect x="40" y="539" width="204.9375" height="48" rx="9" fill="#CCE879"/><text x="60" y="566" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Sign in to workspace</tspan></text></a><a href="S01.svg"><rect x="256.9375" y="539" width="145.171875" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="276.9375" y="566" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="276.9375" dy="0">Back to kiosk</tspan></text></a><text x="40" y="625" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>