<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>The scale is unavailable</title><rect width="1440" height="980" fill="#F5F6F2"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#FFFFFF"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18211D"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="980" dy="0">MEMBER KIOSK</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="40" dy="0">KIOSK</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="40" dy="0">The scale is unavailable</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="40" dy="0">We could not obtain a stable, valid reading from the connected scale.</tspan></text><rect x="40.0" y="263" width="670.0" height="158" rx="14" fill="#FFFFFF"/><text x="62.0" y="295" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="62.0" dy="0">Current reading</tspan></text><text x="62.0" y="346" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="62.0" dy="0">—</tspan></text><text x="62.0" y="386" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="62.0" dy="0">Connection or reading error</tspan></text><rect x="730.0" y="263" width="670.0" height="158" rx="14" fill="#FFFFFF"/><text x="752.0" y="295" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#66736B"><tspan x="752.0" dy="0">Last accepted weight</tspan></text><text x="752.0" y="346" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#18211D"><tspan x="752.0" dy="0">76.0 kg</tspan></text><text x="752.0" y="386" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#235C43"><tspan x="752.0" dy="0">Unchanged</tspan></text><rect x="40" y="445" width="1360" height="90" rx="12" fill="#FFF2D9"/><text x="64" y="479" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#8D5D0D"><tspan x="64" dy="0">Nothing has been overwritten</tspan></text><text x="64" y="508" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="64" dy="0">Check the scale connection, step off the scale, then try again. Only a stable reading that you confirm can replace the last accepted measurement.</tspan></text><a href="S03.svg"><rect x="40" y="559" width="196.875" height="48" rx="9" fill="#CCE879"/><text x="60" y="586" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Retry measurement</tspan></text></a><a href="S24.svg"><rect x="248.875" y="559" width="175.8125" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="268.875" y="586" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="268.875" dy="0">Ask staff for help</tspan></text></a><text x="40" y="645" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>