<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Review member follow-up</title><rect width="1440" height="980" fill="#F5F6F2"/><text x="264" y="47" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena / Review member follow-up</tspan></text><rect x="1240" y="32" width="121.453125" height="28" rx="6" fill="#F5F6F2"/><text x="1252" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="1252" dy="0">Prototype data</tspan></text><text x="264" y="103" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="264" dy="0">STAFF</tspan></text><text x="264" y="150" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="264" dy="0">Review member follow-up</tspan></text><text x="264" y="194" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="264" dy="0">Select the reason, check the approved source and preview the message before delivery.</tspan></text><rect x="264" y="230" width="1144" height="240" rx="12" fill="#FFFFFF"/><text x="288.0" y="266" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="288.0" dy="0">Member</tspan></text><rect x="288.0" y="281" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="302.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="302.0" dy="0">Omar Hassan · GA-0107</tspan></text><text x="848.0" y="266" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="848.0" dy="0">Follow-up type</tspan></text><rect x="848.0" y="281" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="862.0" y="307" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="862.0" dy="0">Approved challenge summary</tspan></text><text x="288.0" y="368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="288.0" dy="0">Source result</tspan></text><rect x="288.0" y="383" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="302.0" y="409" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="302.0" dy="0">GA-S014 · Valid and approved</tspan></text><text x="848.0" y="368" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="848.0" dy="0">Recipient</tspan></text><rect x="848.0" y="383" width="536.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="862.0" y="409" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="862.0" dy="0">Designated test recipient 01</tspan></text><rect x="264.0" y="494" width="561.0" height="195" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="288.0" y="539" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="288.0" dy="0">Message preview</tspan></text><text x="288.0" y="580" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="288.0" dy="0">Hi Omar, your approved squat challenge is complete: 20</tspan><tspan x="288.0" dy="24">accepted repetitions and +10 points. Your next approved</tspan><tspan x="288.0" dy="24">challenge is ready.</tspan></text><rect x="847.0" y="494" width="561.0" height="195" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="871.0" y="539" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="871.0" dy="0">Why this message?</tspan></text><text x="871.0" y="580" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="871.0" dy="0">An approved session summary is available. For a member</tspan><tspan x="871.0" dy="24">without one, use a challenge invitation and label the reason</tspan><tspan x="871.0" dy="24">‘No recorded camera session’.</tspan></text><text x="264" y="727" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#66736B"><tspan x="264" dy="0">No recorded camera session does not mean the member was absent from the gym. Renewal messages use current subscription status.</tspan></text><a href="S22.svg"><rect x="264" y="758" width="169.390625" height="48" rx="9" fill="#CCE879"/><text x="284" y="785" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="284" dy="0">Queue follow-up</tspan></text></a><a href="S22.svg"><rect x="445.390625" y="758" width="249.90625" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="465.390625" y="785" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="465.390625" dy="0">Return to message history</tspan></text></a><text x="264" y="844" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text><rect x="0" y="0" width="232" height="980" rx="0" fill="#14241D"/><text x="24" y="56" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF"><tspan x="24" dy="0">gymarena</tspan></text><text x="24" y="104" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#CCE879"><tspan x="24" dy="0">STAFF WORKSPACE</tspan></text><a href="S18.svg"><text x="32" y="162" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Overview</tspan></text></a><a href="S19.svg"><text x="32" y="219" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Members</tspan></text></a><a href="S07.svg"><text x="32" y="276" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Assessments</tspan></text></a><a href="S08.svg"><text x="32" y="333" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Challenge rules</tspan></text></a><a href="S21.svg"><text x="32" y="390" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Reminders</tspan></text></a><a href="S22.svg"><rect x="16" y="422" width="200" height="46" rx="8" fill="#235C43"/><text x="32" y="447" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Message log</tspan></text></a><a href="S16.svg"><text x="32" y="504" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Leaderboard</tspan></text></a><text x="30" y="868" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF"><tspan x="30" dy="0">Mahmoud Emad</tspan></text><text x="30" y="894" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="400" fill="#B5C8BB"><tspan x="30" dy="0">Authorized staff</tspan></text><text x="30" y="938" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"><tspan x="30" dy="0">Open member kiosk</tspan></text></svg>