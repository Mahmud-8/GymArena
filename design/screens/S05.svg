<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Is this your profile?</title><rect width="1440" height="980" fill="#F5F6F2"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#FFFFFF"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18211D"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="980" dy="0">MEMBER KIOSK</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="40" dy="0">KIOSK</tspan></text><text x="40" y="183" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="40" dy="0">Is this your profile?</tspan></text><text x="40" y="227" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="40" dy="0">A camera match is a suggestion. Confirm your identity before accessing a challenge.</tspan></text><rect x="40.0" y="263" width="669.0" height="280" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="64.0" y="308" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="64.0" dy="0">Omar Hassan</tspan></text><text x="64.0" y="349" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="64.0" dy="0">Member code GA-0107 · Face match passed the configured quality checks.</tspan></text><rect x="64.0" y="371" width="149.15625" height="28" rx="6" fill="#FFF2D9"/><text x="76.0" y="386" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#8D5D0D"><tspan x="76.0" dy="0">Needs confirmation</tspan></text><a href="S06.svg"><rect x="64.0" y="413" width="153.625" height="48" rx="9" fill="#CCE879"/><text x="84.0" y="440" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="84.0" dy="0">Yes, this is me</tspan></text></a><a href="S05.svg"><rect x="64.0" y="473" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="84.0" y="500" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="84.0" dy="0">Not me</tspan></text></a><rect x="731.0" y="263" width="669.0" height="280" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="755.0" y="308" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="755.0" dy="0">Use your member code</tspan></text><text x="755.0" y="349" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="755.0" dy="0">Choose this if recognition is unavailable, uncertain or declined.</tspan></text><a href="S06.svg"><rect x="755.0" y="371" width="210.65625" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="775.0" y="398" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="775.0" dy="0">Find by member code</tspan></text></a><a href="S24.svg"><rect x="755.0" y="431" width="175.8125" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="775.0" y="458" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="775.0" dy="0">Ask staff for help</tspan></text></a><rect x="40" y="567" width="1360" height="138" rx="12" fill="#FFFFFF"/><text x="64.0" y="603" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="64.0" dy="0">Member code</tspan></text><rect x="64.0" y="618" width="644.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="78.0" y="644" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="78.0" dy="0">GA-0107</tspan></text><text x="732.0" y="603" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#66736B"><tspan x="732.0" dy="0">Access method</tspan></text><rect x="732.0" y="618" width="644.0" height="47" rx="7" fill="#FCFDFA" stroke="#E0E5DE"/><text x="746.0" y="644" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="746.0" dy="0">Member code fallback</tspan></text><a href="S01.svg"><rect x="40" y="729" width="173.046875" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="60" y="756" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Back to welcome</tspan></text></a><text x="40" y="815" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>