mily="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="1143.4666666666667" dy="0">Retry eligible</tspan></text><path d="M284 440H1388" stroke="#E0E5DE"/><text x="294" y="468" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#18211D"><tspan x="294" dy="0">Salma · Old expiry reminder</tspan></text><text x="626.4" y="468" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="626.4" dy="0">25 Sep 2026</tspan></text><text x="884.9333333333333" y="468" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="884.9333333333333" dy="0">Cancelled after renewal</tspan></text><text x="1143.4666666666667" y="468" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="1143.4666666666667" dy="0">No resend</tspan></text><path d="M284 490H1388" stroke="#E0E5DE"/><text x="294" y="518" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#18211D"><tspan x="294" dy="0">Nour · Challenge invitation</tspan></text><text x="626.4" y="518" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="626.4" dy="0">22 Oct 2026</tspan></text><text x="884.9333333333333" y="518" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="884.9333333333333" dy="0">Accepted by provider</tspan></text><text x="1143.4666666666667" y="518" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="1143.4666666666667" dy="0">Await acknowledgement</tspan></text><path d="M284 540H1388" stroke="#E0E5DE"/><rect x="264" y="586" width="1144" height="90" rx="12" fill="#E7F0E9"/><text x="288" y="620" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#235C43"><tspan x="288" dy="0">Retry only when safe</tspan></text><text x="288" y="649" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="288" dy="0">A failed delivery may be retried only when it has not already been confirmed as sent. Keep the provider message ID and member-linked history.</tspan></text><a href="S22.svg"><rect x="264" y="700" width="201.171875" height="48" rx="9" fill="#CCE879"/><text x="284" y="727" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="284" dy="0">Retry failed delivery</tspan></text></a><a href="S23.svg"><rect x="477.171875" y="700" width="170.875" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="497.171875" y="727" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="497.171875" dy="0">Create follow-up</tspan></text></a><text x="264" y="786" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text><rect x="0" y="0" width="232" height="980" rx="0" fill="#14241D"/><text x="24" y="56" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF"><tspan x="24" dy="0">gymarena</tspan></text><text x="24" y="104" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#CCE879"><tspan x="24" dy="0">STAFF WORKSPACE</tspan></text><a href="S18.svg"><text x="32" y="162" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Overview</tspan></text></a><a href="S19.svg"><text x="32" y="219" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Members</tspan></text></a><a href="S07.svg"><text x="32" y="276" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FFFFFF"><tspan x="32" dy="0">Assessments</tspan></text></a><a href="S08.svg"><text x="32" y="333" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#FF