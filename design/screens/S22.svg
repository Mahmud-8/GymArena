<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980"><title>Message activity</title><rect width="1440" height="980" fill="#F5F6F2"/><text x="264" y="47" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#66736B"><tspan x="264" dy="0">GymArena / Message activity</tspan></text><rect x="1240" y="32" width="121.453125" height="28" rx="6" fill="#F5F6F2"/><text x="1252" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="1252" dy="0">Prototype data</tspan></text><text x="264" y="103" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="264" dy="0">STAFF</tspan></text><text x="264" y="150" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#18211D"><tspan x="264" dy="0">Message activity</tspan></text><text x="264" y="194" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="264" dy="0">Provider acknowledgements determine the delivery state. A submission is not proof of delivery.</tspan></text><rect x="264" y="230" width="1144" height="332" rx="12" fill="#FFFFFF" stroke="#E0E5DE"/><rect x="282" y="248" width="1108" height="42" rx="4" fill="#F5F6F2"/><text x="294" y="271" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="294" dy="0">Member / purpose</tspan></text><text x="626.4" y="271" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="626.4" dy="0">Scheduled for</tspan></text><text x="884.9333333333333" y="271" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="884.9333333333333" dy="0">Status</tspan></text><text x="1143.4666666666667" y="271" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="1143.4666666666667" dy="0">Action</tspan></text><text x="294" y="318" font-family