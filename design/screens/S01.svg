<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="998" viewBox="0 0 1440 998"><title>Your next challenge starts here.</title><rect width="1440" height="998" fill="#F5F6F2"/><rect x="0" y="0" width="1440" height="90" rx="0" fill="#FFFFFF"/><text x="40" y="50" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#18211D"><tspan x="40" dy="0">gymarena</tspan></text><text x="980" y="47" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#66736B"><tspan x="980" dy="0">MEMBER KIOSK</tspan></text><a href="S24.svg"><rect x="1210" y="21" width="145" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="1230" y="48" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="1230" dy="0">Staff access</tspan></text></a><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="40" dy="0">KIOSK</tspan></text><text x="40" y="207" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#18211D"><tspan x="40" dy="0">Your next challenge starts here.</tspan></text><text x="40" y="263" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="40" dy="0">A personal workout or a friendly face-off. Choose how you want to begin.</tspan></text><rect x="40.0" y="299" width="669.0" height="202" rx="15" fill="#E7F0E9" stroke="#E0E5DE"/><text x="64.0" y="344" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="64.0" dy="0">First visit?</tspan></text><text x="64.0" y="385" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="64.0" dy="0">Create your profile, confirm your weight and meet your trainer for a starting</tspan><tspan x="64.0" dy="24">assessment.</tspan></text><a href="S02.svg"><rect x="64.0" y="431" width="177.015625" height="48" rx="9" fill="#CCE879"/><text x="84.0" y="458" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="84.0" dy="0">Create my profile</tspan></text></a><rect x="731.0" y="299" width="669.0" height="202" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="755.0" y="344" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="755.0" dy="0">Welcome back</tspan></text><text x="755.0" y="385" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="755.0" dy="0">Confirm your profile with the camera or enter your member code. Your next</tspan><tspan x="755.0" dy="24">approved challenge will be ready.</tspan></text><a href="S05.svg"><rect x="755.0" y="431" width="159.03125" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="775.0" y="458" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="775.0" dy="0">Find my profile</tspan></text></a><rect x="40.0" y="525" width="669.0" height="195" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="64.0" y="570" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="64.0" dy="0">Squats</tspan></text><text x="64.0" y="611" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="64.0" dy="0">Clear targets. Counted repetitions. Feedback while you move.</tspan></text><rect x="64.0" y="633" width="148.609375" height="28" rx="6" fill="#E7F0E9"/><text x="76.0" y="648" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="76.0" dy="0">Supported exercise</tspan></text><rect x="731.0" y="525" width="669.0" height="195" rx="15" fill="#FFFFFF" stroke="#E0E5DE"/><text x="755.0" y="570" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#18211D"><tspan x="755.0" dy="0">Jumping jacks</tspan></text><text x="755.0" y="611" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#66736B"><tspan x="755.0" dy="0">Play solo or compete with another member using one shared camera.</tspan></text><rect x="755.0" y="633" width="127.03125" height="28" rx="6" fill="#E7F0E9"/><text x="767.0" y="648" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700" fill="#235C43"><tspan x="767.0" dy="0">Solo + local 1v1</tspan></text><rect x="40" y="744" width="1360" height="90" rx="12" fill="#FFFFFF"/><text x="64" y="778" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#235C43"><tspan x="64" dy="0">You are in control</tspan></text><text x="64" y="807" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#18211D"><tspan x="64" dy="0">Face enrollment is optional. You can always use your member code instead.</tspan></text><a href="S16.svg"><rect x="40" y="858" width="200.5" height="48" rx="9" fill="#FFFFFF" stroke="#E0E5DE"/><text x="60" y="885" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#18211D"><tspan x="60" dy="0">Explore leaderboard</tspan></text></a><text x="40" y="944" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="400" fill="#66736B"><tspan x="40" dy="0">GymArena • Interface prototype • Sample values for review</tspan></text></svg>