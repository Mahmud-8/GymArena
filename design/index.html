function badge(s,t='Success'){return `<span class="badge ${t}">${esc(s)}</span>`}

function card(x){return `<article class="card ${x.bg||''}"><h2>${esc(x.title)}</h2>${x.body?`<p>${esc(x.body)}</p>`:''}${x.value?`<div class="number">${esc(x.value)}</div>`:''}${x.status?badge(x.status,x.tone):''}${x.actions?acts(x.actions):''}</article>`}

function renderBlock(b,s){if(b.type==='metrics')return `<div class="row">${b.items.map(x=>`<article class="metric"><div class="metric-label">${esc(x[0])}</div><div class="number">${esc(x[1])}</div>${x[2]?`<div class="metric-note">${esc(x[2])}</div>`:''}</article>`).join('')}</div>`;
